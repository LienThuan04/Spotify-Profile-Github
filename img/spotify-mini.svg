.eq-dots i { display: block; width: 3px; border-radius: 1px; background: repeating-linear-gradient(to top, currentColor 0, currentColor 2px, transparent 2px, transparent 4px); animation: dots .8s ease-in-out infinite alternate; }
@keyframes dots { from { height: 4px; } to { height: 16px; } }
.eq-vu { align-items: flex-end; gap: 2px; height: 14px; }

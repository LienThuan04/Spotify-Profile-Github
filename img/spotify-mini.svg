.clock-running {
  display: inline-flex; height: 13px; overflow: hidden;
  animation: clock-hide var(--clock-remaining) step-end forwards;
}
.clock-final {
  visibility: hidden; text-align: right;
  animation: clock-show var(--clock-remaining) step-end forwards;
}
.clock-window { display: block; width: 1ch; height: 13px; overflow: hidden; }

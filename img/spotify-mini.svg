@keyframes bubble-up { 0% { transform: translateY(0) scale(.5); opacity: 0; } 30% { opacity: .8; } 80% { opacity: .8; } 100% { transform: translateY(-20px) scale(1.1); opacity: 0; } }
.eq-skyline { align-items: flex-end; gap: 5px; height: 20px; padding: 4px 4px 0 0; }
.song-row .eq-skyline { height: 16px; gap: 4px; }
.eq-skyline i { position: relative; display: block; width: 6px; height: 45%; background: currentColor; animation: skyline .9s ease-in-out infinite alternate; }
.eq-skyline i::after { content: ""; position: absolute; top: 0; left: 100%; width: 3px; height: 100%; background: currentColor; filter: brightness(.5); transform: skewY(-35deg); transform-origin: top left; }
.eq-skyline i::before { content: ""; position: absolute; bottom: 100%; left: 0; width: 6px; height: 3px; background: currentColor; filter: brightness(1.35); transform: skewX(-55deg); transform-origin: bottom left; }
@keyframes skyline { from { height: 20%; } to { height: 100%; } }
.eq-tunnel { width: 22px; height: 16px; align-items: center; justify-content: center; }
.eq-tunnel .tunnel-box { position: relative; width: 22px; height: 16px; display: flex; align-items: center; justify-content: center; }
.eq-tunnel i { position: absolute; box-sizing: border-box; width: 20px; height: 14px; border: 1.5px solid currentColor; border-radius: 2px; animation: tunnel-run 2s linear infinite; }
.eq-tunnel i:nth-child(1) { animation-delay: 0s; }

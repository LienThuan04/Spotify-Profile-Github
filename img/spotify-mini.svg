.eq-ring .ring-g { transform-origin: 18px 18px; animation: ring-spin 6s linear infinite; }
@keyframes ring-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.eq-ripple { align-items: center; justify-content: center; width: 20px; height: 20px; }
.eq-ripple .ripple-svg { width: 20px; height: 20px; }
.eq-ripple .rip { transform-origin: 20px 20px; animation: rip 1.8s cubic-bezier(0,.2,.8,1) infinite; }
.eq-ripple .rip-2 { animation-delay: -.6s; }
.eq-ripple .rip-3 { animation-delay: -1.2s; }
@keyframes rip { 0% { transform: scale(.15); opacity: 1; } 100% { transform: scale(1.1); opacity: 0; } }
.eq-heartbeat { width: 100%; max-width: 176px; height: 18px; overflow: hidden; align-items: center; }

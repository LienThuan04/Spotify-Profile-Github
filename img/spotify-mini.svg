.clock-reel > span { display: block; height: 13px; line-height: 13px; }
@keyframes clock-reel {
  from { transform: translateY(0); }
  to { transform: translateY(calc(-13px * var(--clock-rows))); }
}
@keyframes clock-hide { to { visibility: hidden; } }
@keyframes clock-show { to { visibility: visible; } }

.eq { display: inline-flex; flex-shrink: 0; color: #1ed760; }
.eq-bars { align-items: flex-end; gap: 2px; height: 12px; }

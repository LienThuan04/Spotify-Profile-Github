@keyframes heartbeat { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.eq-pixel { align-items: flex-end; gap: 3px; height: 14px; }
.eq-pixel i { display: block; width: 4px; height: 4px; background: currentColor; animation: pixel-bounce .6s steps(4, end) infinite alternate; }
@keyframes pixel-bounce { 0% { height: 3px; } 33% { height: 6px; } 66% { height: 10px; } 100% { height: 14px; } }
.eq-glow { align-items: flex-end; gap: 3px; height: 14px; filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 6px currentColor); }
.eq-glow i { display: block; width: 3px; height: 5px; border-radius: 2px; background: currentColor; animation: glow-bar 1s ease-in-out infinite alternate; }
